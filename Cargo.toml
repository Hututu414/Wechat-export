[package]
name = "wechat-export"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
anyhow = "1.0"
aes = "0.8"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
memchr = "2"
zeroize = "1"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
quick-xml = "0.41"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_UI_WindowsAndMessaging"] }
rusqlite = { version = "0.38", features = ["bundled", "hooks"] }

[build-dependencies]
embed-resource = "3.0"

[profile.release]
lto = "thin"
strip = true
